<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mi Página con Bootstrap</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>

<!-- Barra de navegación -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">MiSitio</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link active" href="#inicio">Inicio</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#perfil">Perfil</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#contacto">Contacto</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<!-- Sección Inicio con carrusel -->
<section id="inicio" class="mt-4">
  <div class="container">
    <div id="carouselExample" class="carousel slide" data-bs-ride="carousel">
      <div class="carousel-inner text-center">
        <!-- Imágenes con marco (bordes redondeados y sombra) -->
        <div class="carousel-item active">
          <img src="imagen (1).png"
            class="d-block w-75 mx-auto img-fluid rounded shadow"
            style="max-height: 300px; object-fit: cover;" alt="Imagen 1" />
        </div>
        <div class="carousel-item">
          <img src="images (2).jpeg"
            class="d-block w-75 mx-auto img-fluid rounded shadow"
            style="max-height: 300px; object-fit: cover;" alt="Imagen 2" />
        </div>
        <div class="carousel-item">
          <img src="images (3).jpeg"
            class="d-block w-75 mx-auto img-fluid rounded shadow"
            style="max-height: 300px; object-fit: cover;" alt="Imagen 3" />
        </div>
      </div>
      <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
        <span class="carousel-control-prev-icon"></span>
      </button>
      <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
        <span class="carousel-control-next-icon"></span>
      </button>
    </div>
  </div>
</section>

<!-- Sección Perfil -->
<section id="perfil" class="mt-5">
  <div class="container">
    <div class="row justify-content-center" id="perfiles">
      <!-- Aquí se agregarán los perfiles de usuario -->
    </div>
  </div>
</section>

<!-- Sección Contacto con validación -->
<section id="contacto" class="mt-5 mb-5">
  <div class="container">
    <h2 class="mb-4 text-center">Contacto</h2>
    <div class="row justify-content-center">
      <div class="col-md-8">
        <form id="contactoForm" class="needs-validation" novalidate>
          <div class="mb-3">
            <label for="nombre" class="form-label">Nombre</label>
            <input type="text" class="form-control" id="nombre" required>
            <div class="invalid-feedback">Por favor ingresa tu nombre.</div>
          </div>
          <div class="mb-3">
            <label for="correo" class="form-label">Correo Electrónico</label>
            <input type="email" class="form-control" id="correo" required>
            <div class="invalid-feedback">Por favor ingresa un correo electrónico válido.</div>
          </div>
          <div class="mb-3">
            <label for="mensaje" class="form-label">Mensaje</label>
            <textarea class="form-control" id="mensaje" rows="4" required></textarea>
            <div class="invalid-feedback">Por favor escribe un mensaje.</div>
          </div>
          <div class="mb-3">
            <label for="foto" class="form-label">Foto de Perfil</label>
            <input type="file" class="form-control" id="foto" accept="image/*" required>
            <div class="invalid-feedback">Por favor selecciona una foto.</div>
          </div>
          <button type="submit" class="btn btn-success">Enviar</button>
        </form>
        <!-- Mensajes de estado -->
        <div id="message-status" class="mt-3"></div>
      </div>
    </div>
  </div>
</section>

<!-- Sección de Datos Enviados -->
<section id="datosGuardados" class="mt-5 mb-5">
  <div class="container">
    <h2 class="mb-4 text-center">Datos Enviados</h2>
    <div id="datosListados" class="list-group"></div>
  </div>
</section>

<!-- Scripts de Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Script JavaScript -->
<script>
  (() => {
    'use strict';
    const forms = document.querySelectorAll('.needs-validation');
    const perfilesContainer = document.getElementById('perfiles'); // Donde se mostrarán los perfiles

    // Array para almacenar los datos enviados
    const datosEnviados = [];

    Array.from(forms).forEach(form => {
      form.addEventListener('submit', (event) => {
        event.preventDefault();
        if (!form.checkValidity()) {
          event.stopPropagation();
          form.classList.add('was-validated');
          return;
        }

        // Recopilar los datos del formulario
        const nombre = document.getElementById('nombre').value;
        const correo = document.getElementById('correo').value;
        const mensaje = document.getElementById('mensaje').value;
        const foto = document.getElementById('foto').files[0]; // Obtener la foto seleccionada

        // Validar si el usuario seleccionó una foto
        if (!foto) {
          return alert("Por favor selecciona una foto.");
        }

        // Crear un objeto de imagen y leer la foto seleccionada
        const reader = new FileReader();
        reader.onloadend = function () {
          const fotoUrl = reader.result; // URL de la foto cargada

          // Guardar los datos en el array
          datosEnviados.push({ nombre, correo, mensaje, fotoUrl });

          // Mostrar los datos en la página como perfil
          mostrarPerfil(nombre, correo, mensaje, fotoUrl);

          // Restablecer el formulario y la validación
          form.reset();
          form.classList.remove('was-validated');

          // Mostrar mensaje de éxito
          const messageStatus = document.getElementById('message-status');
          messageStatus.innerHTML = `<div class="alert alert-success">Formulario enviado correctamente</div>`;
        };

        // Leer la imagen como una URL
        reader.readAsDataURL(foto);
      });
    });

    // Función para mostrar un perfil nuevo
    function mostrarPerfil(nombre, correo, mensaje, fotoUrl) {
      // Crear una tarjeta de perfil para el nuevo contacto
      const perfilCard = document.createElement('div');
      perfilCard.classList.add('col-md-4', 'mb-4');

      perfilCard.innerHTML = `
        <div class="card text-center shadow">
          <img src="${fotoUrl}"
               class="card-img-top rounded-circle mx-auto mt-3"
               style="width: 150px;" alt="Foto de perfil" />
          <div class="card-body">
            <h5 class="card-title">${nombre}</h5>
            <p class="card-text">Correo: ${correo}</p>
            <p class="card-text">Mensaje: ${mensaje}</p>
          </div>
        </div>
      `;

      // Agregar la tarjeta al contenedor de perfiles
      perfilesContainer.appendChild(perfilCard);
    }
  })();
</script>

</body>
</html>
